name: Request Pages Branch Build

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  request-build:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          CODE=$(curl -sS \
            --connect-timeout 15 \
            --max-time 60 \
            -o "$RUNNER_TEMP/pages-response.json" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds")

          echo "PAGES_BUILD_HTTP=$CODE"
          test "$CODE" = 201

          echo "PAGES_BUILD_REQUEST=PASS"
